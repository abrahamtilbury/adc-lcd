
! UEECS0007 - PRACTICAL ASSESSMENT 6
! VLAN CONFIGURATION, VTP AND NETWORK EXPANSION
!
! TASK 1 - INITIAL NETWORK
! Switch model: Cisco Catalyst 2950-24
! VTP domain: ASSESS6
! VTP version: 2
! VTP server: Switch31
! VTP clients: Switch29, Switch30, Switch32, Switch33
!
! PC ADDRESSING - ALL USE SUBNET MASK 255.255.255.0
! PC6  - 192.168.1.2 - VLAN 10 - Switch30 Fa0/1
! PC9  - 192.168.1.5 - VLAN 10 - Switch31 Fa0/1
! PC7  - 192.168.1.3 - VLAN 20 - Switch32 Fa0/1
! PC8  - 192.168.1.4 - VLAN 20 - Switch29 Fa0/1
! PC10 - 192.168.1.6 - VLAN 30 - Switch33 Fa0/1
!
! TRUNK CONNECTIONS
! Switch30 Fa0/2 <--> Switch29 Fa0/2
! Switch29 Fa0/3 <--> Switch31 Fa0/2
! Switch30 Fa0/3 <--> Switch32 Fa0/2
! Switch32 Fa0/3 <--> Switch31 Fa0/3
! Switch31 Fa0/4 <--> Switch33 Fa0/2
!
! TASK 1 VERIFICATION
! Check VTP server/client modes and domain.
! Check VLANs 10, 20, 30 on all switches.
! Check trunk operation and STP state.
! Ping PC6 to PC9 within VLAN 10.
! Ping PC7 to PC8 within VLAN 20.
! No inter-VLAN routing is required.
!
! TASK 2 - NETWORK EXPANSION
! Create VLAN 40 on VTP server only.
! Verify VLAN 40 propagates to VTP clients.
! Assign access ports for VLAN 40 after
! confirming assessment's Switch4/Switch7 mapping.
! Verify same-VLAN connectivity.
!
! TASK 3 - VLAN DELETION
! Delete VLAN 30 from the VTP server.
! Verify deletion propagates to all clients.
! Check affected access ports and connectivity.
!
! NOTE: Tasks 2 and 3 are performed sequentially.
! Preserve evidence before changing VLAN configuration.

! ==================================================
! SWITCH31 - VTP SERVER
! ==================================================
enable
configure terminal
hostname Switch31
vtp domain ASSESS6
vtp version 2
vtp mode server
!
vlan 10
exit
vlan 20
exit
vlan 30
exit
!
interface range fastEthernet 0/2 - 4
switchport mode trunk
exit
end

! ==================================================
! SWITCH29 - VTP CLIENT - PC8 VLAN 20
! ==================================================
enable
configure terminal
hostname Switch29
vtp domain ASSESS6
vtp version 2
vtp mode client
!
interface range fastEthernet 0/2 - 3
switchport mode trunk
exit
!
end

! ==================================================
! SWITCH30 - VTP CLIENT - PC6 VLAN 10
! ==================================================
enable
configure terminal
hostname Switch30
vtp domain ASSESS6
vtp version 2
vtp mode client
!
interface range fastEthernet 0/2 - 3
switchport mode trunk
exit
end

! ==================================================
! SWITCH32 - VTP CLIENT - PC7 VLAN 20
! ==================================================
enable
configure terminal
hostname Switch32
vtp domain ASSESS6
vtp version 2
vtp mode client
!
interface range fastEthernet 0/2 - 3
switchport mode trunk
exit
end

! ==================================================
! SWITCH33 - VTP CLIENT - PC10 VLAN 30
! ==================================================
enable
configure terminal
hostname Switch33
vtp domain ASSESS6
vtp version 2
vtp mode client
!
interface fastEthernet 0/2
switchport mode trunk
exit
end


! ==================================================
! TASK 1 - VERIFY VTP BEFORE ACCESS PORT ASSIGNMENT
! ==================================================
! Complete VTP and trunk setup on all five switches.
!
! Run these commands on EACH switch in privileged EXEC:
! show vtp status
! show vlan brief
! show interfaces trunk
! show spanning-tree
!
! REQUIRED RESULTS:
! Switch31 = VTP SERVER
! Switch29/30/32/33 = VTP CLIENT
! Domain = ASSESS6
! VTP version = 2
! VLANs 10, 20 and 30 present on all switches.
! Required trunk links operational.
! Verify VTP database revision consistency.
!
! STOP if VLAN propagation has failed.
! Do not apply access assignments until verified.
!
! ==================================================
! TASK 1 - ACCESS PORT ASSIGNMENTS
! Apply separately on the named switch.
! ==================================================

! SWITCH31 - PC9 - VLAN 10
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 10
exit
end

! SWITCH29 - PC8 - VLAN 20
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 20
exit
end

! SWITCH30 - PC6 - VLAN 10
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 10
exit
end

! SWITCH32 - PC7 - VLAN 20
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 20
exit
end

! SWITCH33 - PC10 - VLAN 30
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 30
exit
end

! ==================================================
! TASK 1 - CONNECTIVITY TESTS
! ==================================================
! PC6 -> ping 192.168.1.5 (PC9, VLAN 10)
! PC7 -> ping 192.168.1.4 (PC8, VLAN 20)
!
! Both tests should succeed.
! No router required for same-VLAN communication.
! Record results before beginning Task 2.
