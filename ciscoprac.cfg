! UEECS0007 - PRACTICAL ASSESSMENT 6
! VLAN CONFIGURATION, VTP AND NETWORK EXPANSION

! TASK 1 - INITIAL NETWORK
! Switch model: Cisco Catalyst 2950-24
! VTP domain: ASSESS6
! VTP version: 2
! VTP server: Switch31
! VTP clients: Switch29, Switch30, Switch32, Switch33

! PC ADDRESSING - ALL USE SUBNET MASK 255.255.255.0
! PC6  - 192.168.1.2 - VLAN 10 - Switch30 Fa0/1
! PC9  - 192.168.1.5 - VLAN 10 - Switch31 Fa0/1
! PC7  - 192.168.1.3 - VLAN 20 - Switch32 Fa0/1
! PC8  - 192.168.1.4 - VLAN 20 - Switch29 Fa0/1
! PC10 - 192.168.1.6 - VLAN 30 - Switch33 Fa0/1

! TRUNK CONNECTIONS
! Switch30 Fa0/2 <--> Switch29 Fa0/2
! Switch29 Fa0/3 <--> Switch31 Fa0/2
! Switch30 Fa0/3 <--> Switch32 Fa0/2
! Switch32 Fa0/3 <--> Switch31 Fa0/3
! Switch31 Fa0/4 <--> Switch33 Fa0/2

! BEFORE CONNECTING REUSED SWITCHES
! Run show vtp status on each switch.
! Run show vlan brief on each switch.
! Check domain, revision number and existing VLANs.
! Resolve unexpected configurations before connecting.

! ==================================================
! SWITCH31 - VTP SERVER
! ==================================================
enable
configure terminal
hostname Switch31
vtp domain ASSESS6
vtp mode server
vtp version 2

vlan 10
exit
vlan 20
exit
vlan 30
exit

interface range fastEthernet 0/2 - 4
switchport mode trunk
exit
end

! ==================================================
! SWITCH29 - VTP CLIENT - PC8 VLAN 20
! ==================================================
enable
configure terminal
hostname Switch29
vtp domain ASSESS6
vtp mode client

interface range fastEthernet 0/2 - 3
switchport mode trunk
exit

end

! ==================================================
! SWITCH30 - VTP CLIENT - PC6 VLAN 10
! ==================================================
enable
configure terminal
hostname Switch30
vtp domain ASSESS6
vtp mode client
!
interface range fastEthernet 0/2 - 3
switchport mode trunk
exit
end

! ==================================================
! SWITCH32 - VTP CLIENT - PC7 VLAN 20
! ==================================================
enable
configure terminal
hostname Switch32
vtp domain ASSESS6
vtp mode client

interface range fastEthernet 0/2 - 3
switchport mode trunk
exit
end

! ==================================================
! SWITCH33 - VTP CLIENT - PC10 VLAN 30
! ==================================================
enable
configure terminal
hostname Switch33
vtp domain ASSESS6
vtp mode client

interface fastEthernet 0/2
switchport mode trunk
exit
end

! ==================================================
! TASK 1 - VERIFY VTP BEFORE ACCESS PORT ASSIGNMENT
! ==================================================
! Complete VTP and trunk setup on all five switches.
!
! Run these commands on EACH switch in privileged EXEC:
! show vtp status
! show vlan brief
! show interfaces trunk
! show spanning-tree
!
! REQUIRED RESULTS:
! Switch31 = VTP SERVER
! Switch29/30/32/33 = VTP CLIENT
! Domain = ASSESS6
! VTP version = 2
! VLANs 10, 20 and 30 present on all switches.
! Required trunk links operational.
! Verify VTP database revision consistency.
!
! STOP if VLAN propagation has failed.
! Do not apply access assignments until verified.
!
! ==================================================
! TASK 1 - ACCESS PORT ASSIGNMENTS
! Apply separately on the named switch.
! ==================================================

! SWITCH31 - PC9 - VLAN 10
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 10
exit
end

! SWITCH29 - PC8 - VLAN 20
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 20
exit
end

! SWITCH30 - PC6 - VLAN 10
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 10
exit
end

! SWITCH32 - PC7 - VLAN 20
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 20
exit
end

! SWITCH33 - PC10 - VLAN 30
enable
configure terminal
interface fastEthernet 0/1
switchport mode access
switchport access vlan 30
exit
end

! TASK 1 - CONNECTIVITY TEST
! PC6: ping 192.168.1.5
! PC7: ping 192.168.1.4
! Both should succeed.
! On each switch:
! copy running-config startup-config
! Save Packet Tracer project: TASK1.pkt

! TASK 2 - ADD VLAN 40
! Switch31 only
enable
configure terminal
vlan 40
exit
end

! VERIFY - On all five switches:
! show vlan brief
! show vtp status
! VLAN 40 should appear on every switch.

! VLAN 40 ACCESS PORTS - PENDING
! Assessment refers to Switch4 and Switch7.
! Diagram identifies Switch29 to Switch33.
! Confirm switch mapping and PC addresses.

! After completing VLAN 40 port assignments:
! Test connectivity between VLAN 40 PCs.
! On each switch:
! copy running-config startup-config
! Save Packet Tracer project: TASK2.pkt

! TASK 3 - DELETE VLAN 30
! Switch31 only
enable
configure terminal
no vlan 30
end

! VLAN 30 should disappear from all switches.
! Verify before saving Task 3.

! ==================================================
! TASK 3 - VERIFY VLAN 30 DELETION
! ==================================================
! On Switch31:
! show vlan brief
! show vtp status

! On EACH client:
! show vlan brief
! show vtp status

! EXPECTED:
! VLAN 30 absent from all five VLAN databases.
! VLANs 10, 20 and 40 remain present.

! ==================================================
! TASK 3 - INSPECT SWITCH33
! ==================================================
! On Switch33:
! show interfaces fastEthernet 0/1 switchport
! show interfaces fastEthernet 0/1 status
!
! EXPECTED:
! Fa0/1 still configured for access VLAN 30.
! Access VLAN 30 is now inactive.
! PC10 has no functional VLAN 30 connection.
!
! Do not reassign Fa0/1 before documenting
! its state following VLAN deletion.
!
! ==================================================
! TASK 3 - VERIFY REMAINING CONNECTIVITY
! ==================================================
! On PC6:
! ping 192.168.1.5

! On PC7:
! ping 192.168.1.4

! Confirm VLAN 10 and 20 remain functional.
! Retest VLAN 40 connectivity where configured.

