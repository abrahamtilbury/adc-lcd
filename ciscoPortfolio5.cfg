! ============================================================
! 05.2 HQ DISTRIBUTION A
! ============================================================
enable
configure terminal
hostname HQ-DIST-A
no ip domain-lookup
ip routing

! VTP SERVER - centrally creates HQ VLANs
vtp domain P5-HQ
vtp version 2
vtp mode server
vtp password P5VTP2026

vlan 10
 name HR
exit
vlan 20
 name FINANCE
exit
vlan 30
 name IT
exit
vlan 40
 name SALES
exit
vlan 50
 name GUEST
exit
vlan 99
 name MANAGEMENT
exit

spanning-tree vlan 10,20,30,40,50,99 root primary

interface GigabitEthernet0/1
 description L3_TO_HQ_CORE
 no switchport
 ip address 10.254.0.14 255.255.255.252
 no shutdown
exit

interface GigabitEthernet0/2
 description TRUNK_TO_HQ_DIST_B
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown
exit

interface FastEthernet0/1
 description TRUNK_TO_HQ_ACCESS
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown
exit

! HSRP virtual gateway is .1 on every VLAN

interface Vlan10
 ip address 10.10.10.2 255.255.255.0
 ip helper-address 10.254.0.1
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 track GigabitEthernet0/1 20
 standby 10 preempt
 no shutdown
exit

interface Vlan20
 ip address 10.10.20.2 255.255.255.0
 ip helper-address 10.254.0.1
 standby 20 ip 10.10.20.1
 standby 20 priority 110
 standby 20 track GigabitEthernet0/1 20
 standby 20 preempt
 no shutdown
exit

interface Vlan30
 ip address 10.10.30.2 255.255.255.0
 ip helper-address 10.254.0.1
 standby 30 ip 10.10.30.1
 standby 30 priority 110
 standby 30 track GigabitEthernet0/1 20
 standby 30 preempt
 no shutdown
exit

interface Vlan40
