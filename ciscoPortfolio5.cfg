 permit 10.10.99.0 0.0.0.255
 permit 10.20.99.0 0.0.0.255
 permit 10.30.99.0 0.0.0.255
exit

line vty 0 4
 login local
 transport input ssh
 access-class SSH-MGMT in
 exec-timeout 10 0
exit

line vty 5 15
 login local
 transport input ssh
 access-class SSH-MGMT in
 exec-timeout 10 0
exit

