 ip helper-address 10.254.0.1
 standby 99 ip 10.10.99.1
 standby 99 priority 110
 standby 99 track GigabitEthernet0/1 20
 standby 99 preempt
 no shutdown
exit

router ospf 1
 router-id 10.254.0.14
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.254.0.12 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0
 network 10.10.50.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
exit

! ============================================================
! 05.2.7 SECURITY | VLAN ACCESS CONTROL
! ============================================================

! Isolate Guest VLAN from private networks
ip access-list extended GUEST-ISOLATION
 remark Allow DHCP client requests
 permit udp any eq 68 any eq 67
 remark Block private destination networks
 deny ip 10.10.50.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.10.50.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.10.50.0 0.0.0.255 192.168.0.0 0.0.255.255
