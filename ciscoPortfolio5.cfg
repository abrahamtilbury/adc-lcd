! Portfolio 5
!
! VLAN 10 - HR, 20 - Finance, 30 - IT, 40 - Sales
!
! Inter-VLAN routing from multilayer switches
! OSPF internal routing on each site
! BGP (Border Gateway Protocol - loop-free path routing protocol between organisations) 
! Routing loop occurs when routers keep sending packets - because nether knows the correct path to destination, packet never reaches destination
! BGP uses AS_PATH attribute, which records the autonomous systems a route advertisement has passed through
! if a router receives a route containing its own AS number, BGP rejects that route by default
!
! VLAN  DEPARTMENT  HQ network      Japan network  Singapore network
! 10    HR          10.10.10.0/24   10.20.10.0/24  10.30.10.0/24
! 20    Finance     10.10.20.0/24   10.20.20.0/24  10.30.20.0/24
! 30    IT          10.10.30.0/24   10.20.30.0/24  10.30.30.0/24
! 40    Sales       10.10.40.0/24   10.20.40.0/24  10.30.40.0/24
! 50    Guest Wi-Fi 10.10.50.0/24   10.20.50.0/24  10.30.50.0/24
! 99    Management  10.10.99.0/24   10.20.99.0/24  10.30.99.0/24
!
!  IP ENDING  Reserved for
!  .1         Default Gateway (HSRP virtual IP at HQ)
!  .2         Distribution switch A
!  .3         Distribution switch B
!  .10        Server, if needed
!  .11-.29    Network device management
!  .100-.199  DHCP client allocations
!
!  Connection                        Network        HQ router    Branch router
!  HQ to Japan                       10.255.0.0/30  10.255.0.1   10.255.0.2
!  HQ to Singapore                   10.255.0.4/30  10.255.0.5   10.255.0.6
!  HQ router to core                 10.254.0.0/30
!  Japan router to Distribution      10.254.0.4/30
!  Singapore router to Distribution  10.254.0.8/30 

! Subnetmask 2555.255.255.252

! DEVICE                Hostname  Interface  IP
! Headquarters router   HQ-RTR    S0/3/0,1   10.255.0.1,5
! Japan router          JPN-RTR   S0/3/0     10.255.0.2
! Singapore router      SGP-RTR   S0/3/0     10.255.0.6

En                                                   ! 02: HQ Router Configuration
Config t
hostname HQ-RTR
int s0/3/0
ip add 10.255.0.1 255.255.255.252
no shut
exit
int gig0/0
ip add 10.254.0.1 255.255.255.0
no shut
exit
no shut
exit
ip dhcp excluded-address 10.254.0.1 ip dhcp excluded-address 20.0.0.1
ip route 70.0.0.0 255.255.255.252 10.255.0.2
                                                    ! 02.3: DHCP Configuration
service dhcp
ip dhcp pool pool1
network 10.0.0.0 255.255.255.0
default-router 10.254.0.1
exit
ip dhcp pool pool2
network 20.0.0.0 255.255.255.0
default-router 20.0.0.1
exit
router rip version 2
no auto-summary
network 10.0.0.0
network 20.0.0.0
network 60.0.0.0
exit
                                                    ! 02.4: R1 - RIP V2
router bgp 65001 neighbor 10.255.0.6 remote-as 65002
network 10.0.0.0 mask 255.255.255.0
network 20.0.0.0 mask 255.255.255.0
exit
                                                    ! 02.5: R1 BGP Configuration
ip domain-name cisco.com username admin privilege 15 secret cisco
crypto key generate rsa ip ssh version 2
line vty 0 4
login local
transport input ssh
exit
line vty 5 15
login local
transport input ssh
exit
end
write memory
En                                                   !03: Japan Router Configuration
Config t
hostname JPN-RTR
int s0/3/0
ip add 10.255.0.2 255.255.255.252
no shut
exit
int gig0/0
                                                    ! 02.6: R1 SSH CONFIGURATION
                                                    ! Choose 2048 bits when prompted, paste upto here
ip add 10.254.0.5 255.255.255.0
no shut
exit
no shut
exit
int s0/3/1
ip add 70.0.0.1 255.255.255.252
no shut
exit
ip dhcp excluded-address 10.254.0.5
ip dhcp excluded-address 40.0.0.1
service dhcp
ip dhcp pool pool1
network 30.0.0.0 255.255.255.0
default-router 10.254.0.5
exit
ip dhcp pool pool2
network 40.0.0.0 255.255.255.0
default-router 40.0.0.1
exit
router rip version 2
no auto-summary
network 30.0.0.0
network 40.0.0.0
network 60.0.0.0
exit

router ospf 1 network 30.0.0.0 0.0.0.255 area 0
network 40.0.0.0 0.0.0.255 area 0
network 70.0.0.0 0.0.0.3 area 0
exit

ip domain-name cisco.com username admin privilege 15 secret cisco
crypto key generate rsa ip ssh version 2
line vty 0 4
login local
transport input ssh
exit
line vty 5 15
login local
transport input ssh
exit
end
write memory

En
Config t
hostname SGP-RTR                                    ! Singapore Router Configuration
int s0/3/0
ip add 10.255.0.6 255.255.255.252
no shut
exit
int gig0/0
ip add 10.254.0.9 255.255.255.0
no shut
exit
ip dhcp excluded-address 10.254.0.9
ip route 60.0.0.0 255.255.255.252 70.0.0.1
service dhcp ip dhcp pool pool1
network 50.0.0.0 255.255.255.0
default-router 10.254.0.9
exit
router ospf 1 network 50.0.0.0 0.0.0.255 area 0
network 70.0.0.0 0.0.0.3 area 0
exit
router bgp 65002 neighbor 10.255.0.1 remote-as 65001
neighbor 10.255.0.1 ebgp-multihop 2
network 50.0.0.0 mask 255.255.255.0
exit
ip domain-name cisco.com username admin privilege 15 secret cisco
crypto key generate rsa ip ssh version 2
                                                    ! 03.3: R2 RIP CONFIGURATION
                                                    ! 03.4: R2 OSPF CONFIGURATION
                                                    ! 03.5: R2 SSH CONFIGURATION
                                                    ! Choose 2048 bits when prompted, paste upto here
                                                    ! 04: ROUTER 3
                                                    ! 04.3: R3 DHCP configuration
                                                    ! 04.4: R3 OSPF CONFIGURATION
                                                    ! 04.5: Router 3 BGP CONFIGURATION
                                                    ! 04.6: SSH CONFIGURATION
                                                    ! Choose 2048 bits when prompted, paste upto here
line vty 0 4
login local
transport input ssh
exit
line vty 5 15
login local
transport input ssh
exit
end
write memory
show ip interface brief show ip route
show ip dhcp pool
show ip dhcp binding
show ip ssh
show ip protocols show ip route
                                                  ! EXPECT:
                                                  ! R1 learns 30.0.0.0/24 and 40.0.0.0/24 via RIP
                                                  ! R2 learns 10.0.0.0/24 and 20.0.0.0/24 via RIP
                                                  ! R3 does not run RIP
show ip ospf neighbor show ip route
                                                  ! EXPECT:
