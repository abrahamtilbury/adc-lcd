! ============================================================
enable
configure terminal
hostname HQ-DIST-A
no ip domain-lookup
ip routing

! VTP SERVER - centrally creates HQ VLANs
vtp domain P5-HQ
vtp version 2
vtp mode server
vtp password P5VTP2026

vlan 10
 name HR
exit
vlan 20
 name FINANCE
exit
vlan 30
 name IT
exit
vlan 40
 name SALES
exit
vlan 50
 name GUEST
exit
vlan 99
 name MANAGEMENT
exit

spanning-tree vlan 10,20,30,40,50,99 root primary

interface GigabitEthernet0/1
 description L3_TO_HQ_CORE
 no switchport
 ip address 10.254.0.14 255.255.255.252
 no shutdown
exit

interface GigabitEthernet0/2
 description TRUNK_TO_HQ_DIST_B
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown
exit

interface FastEthernet0/1
 description TRUNK_TO_HQ_ACCESS
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown
exit

