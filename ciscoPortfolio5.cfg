ip access-list extended SALES-TO-LOCAL-FINANCE
 deny ip 10.10.40.0 0.0.0.255 10.10.20.0 0.0.0.255
 permit ip any any
exit

! Apply ACLs inbound on source VLANs
interface Vlan50
 ip access-group GUEST-ISOLATION in
exit

interface Vlan40
 ip access-group SALES-TO-LOCAL-FINANCE in
exit

