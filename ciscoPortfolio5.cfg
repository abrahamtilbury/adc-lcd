! Portfolio 5
! VLAN 10 - HR, 20 - Finance, 30 - IT, 40 - Sales

! Inter-VLAN routing from multilayer switches
! OSPF internal routing on each site
! BGP (Border Gateway Protocol - loop-free path routing protocol between organisations) 
! BGP uses AS_PATH attribute, which records the autonomous systems a route advertisement has passed through
! if a router receives a route containing its own AS number, BGP rejects that route by default

! VLAN  DEPARTMENT  HQ network      Japan network  Singapore network
! 10    HR          10.10.10.0/24   10.20.10.0/24  10.30.10.0/24
! 20    Finance     10.10.20.0/24   10.20.20.0/24  10.30.20.0/24
! 30    IT          10.10.30.0/24   10.20.30.0/24  10.30.30.0/24
! 40    Sales       10.10.40.0/24   10.20.40.0/24  10.30.40.0/24
! 50    Guest Wi-Fi 10.10.50.0/24   10.20.50.0/24  10.30.50.0/24
! 99    Management  10.10.99.0/24   10.20.99.0/24  10.30.99.0/24

!  IP ENDING  Reserved for
!  .1         HSRP virtual gateway at HQ; actual SVI gateway at branches
!  .2         Distribution switch A
!  .3         Distribution switch B
!  .10        Server, if needed
!  .11-.29    Network device management
!  .100-.199  DHCP client allocations

! ADDRESSING TABLE — Network, Endpoint A, Endpoint B
!  Connection                        Network          Endpoint A IP             Endpoint B IP
!  HQ to Japan                       10.255.0.0/30    10.255.0.1                10.255.0.2
!  HQ to Singapore                   10.255.0.4/30    10.255.0.5                10.255.0.6
!  HQ router to core                 10.254.0.0/30    10.254.0.1                10.254.0.2
!  Japan router to Distribution      10.254.0.4/30    10.254.0.5                10.254.0.6
!  Singapore router to Distribution  10.254.0.8/30    10.254.0.9                10.254.0.10
!  HQ Core -> Distribution A         10.254.0.12/30   10.254.0.13               10.254.0.14
!  HQ Core -> Distribution B         10.254.0.16/30   10.254.0.17               10.254.0.18

! BGP notes
!  Router  AS number  WAN neighbour
!  HQ-RTR  65000      Japan AS 65001; Singapore AS 65002
!  JPN-RTR 65001      HQ AS 65000
!  SGP-RTR 65002      HQ AS 65000

! Subnet mask for WAN/transit links: 255.255.255.252

!  DEVICE                Hostname  Interface  IP
!  HQ-RTR                          S0/3/0     10.255.0.1/30
!  HQ-RTR                          S0/3/1     10.255.0.5/30
!  HQ-RTR                          G0/0       10.254.0.1/30
!  JPN-RTR                         S0/3/0     10.255.0.2/30
!  JPN-RTR                         G0/0       10.254.0.5/30
!  SGP-RTR                         S0/3/0     10.255.0.6/30
!  SGP-RTR                         G0/0       10.254.0.9/30

! 02: HQ Router Configuration
enable                                                
configure terminal
hostname HQ-RTR

interface Serial0/3/0
 description WAN_to_Japan
 ip address 10.255.0.1 255.255.255.252
 no shutdown
exit

interface Serial0/3/1
 description WAN_to_Singapore
 ip address 10.255.0.5 255.255.255.252
 no shutdown
exit

interface GigabitEthernet0/0
 description TRANSIT_to_HQ_CORE
 ip address 10.254.0.1 255.255.255.252
 no shutdown
exit

! 02.3 HQ OSPF
router ospf 1
 router-id 10.254.0.1
 network 10.254.0.0 0.0.0.3 area 0
 redistribute bgp 65000 subnets
exit

! 02.4 HQ BGP
router bgp 65000
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.6 remote-as 65002
 network 10.10.10.0 mask 255.255.255.0
 network 10.10.20.0 mask 255.255.255.0
 network 10.10.30.0 mask 255.255.255.0
 network 10.10.40.0 mask 255.255.255.0
 network 10.254.0.0 mask 255.255.255.252
 network 10.10.99.0 mask 255.255.255.0
exit

! 02.5 HQ DHCP
service dhcp
ip dhcp excluded-address 10.10.10.1 10.10.10.99
ip dhcp excluded-address 10.10.10.200 10.10.10.254
ip dhcp excluded-address 10.10.20.1 10.10.20.99
ip dhcp excluded-address 10.10.20.200 10.10.20.254
ip dhcp excluded-address 10.10.30.1 10.10.30.99
ip dhcp excluded-address 10.10.30.200 10.10.30.254
ip dhcp excluded-address 10.10.40.1 10.10.40.99
ip dhcp excluded-address 10.10.40.200 10.10.40.254
ip dhcp excluded-address 10.10.50.1 10.10.50.99
ip dhcp excluded-address 10.10.50.200 10.10.50.254
ip dhcp excluded-address 10.10.99.1 10.10.99.99
ip dhcp excluded-address 10.10.99.200 10.10.99.254

ip dhcp pool HQ-HR
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
exit
ip dhcp pool HQ-FINANCE
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
exit
ip dhcp pool HQ-IT
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
exit
ip dhcp pool HQ-SALES
 network 10.10.40.0 255.255.255.0
 default-router 10.10.40.1
exit
ip dhcp pool HQ-GUEST
 network 10.10.50.0 255.255.255.0
 default-router 10.10.50.1
exit
ip dhcp pool HQ-MGMT
 network 10.10.99.0 255.255.255.0
 default-router 10.10.99.1
exit

! 02.6 HQ WAN ACL

ip access-list extended BLOCK-HQ-ACCESS
 permit tcp 10.20.99.0 0.0.0.255 10.10.99.0 0.0.0.255 eq 22
 permit tcp 10.30.99.0 0.0.0.255 10.10.99.0 0.0.0.255 eq 22
 permit tcp 10.20.99.0 0.0.0.255 10.254.0.0 0.0.0.255 eq 22
 permit tcp 10.30.99.0 0.0.0.255 10.254.0.0 0.0.0.255 eq 22
 deny ip 10.20.0.0 0.0.255.255 10.10.0.0 0.0.255.255
 deny ip 10.30.0.0 0.0.255.255 10.10.0.0 0.0.255.255
 deny ip 10.20.0.0 0.0.255.255 10.254.0.0 0.0.0.255
 deny ip 10.30.0.0 0.0.255.255 10.254.0.0 0.0.0.255
 permit ip any any
exit

interface Serial0/3/0
 ip access-group BLOCK-HQ-ACCESS in
exit
interface Serial0/3/1
 ip access-group BLOCK-HQ-ACCESS in
exit


! 02.7 HQ SSH Remote Management
ip domain-name portfolio5.local
enable secret REPLACE_ENABLE_PASSWORD
username admin privilege 15 secret REPLACE_ADMIN_PASSWORD
ip ssh version 2
!
ip access-list standard SSH-MGMT
 permit 10.10.99.0 0.0.0.255
 permit 10.20.99.0 0.0.0.255
 permit 10.30.99.0 0.0.0.255
exit
!
line vty 0 4
 login local
 transport input ssh
 access-class SSH-MGMT in
 exec-timeout 10 0
exit
!
line vty 5 15
 login local
 transport input ssh
 access-class SSH-MGMT in
 exec-timeout 10 0
exit


end
write memory



! PACKET TRACER INTERACTIVE STEP
! In global configuration mode, run:
! crypto key generate rsa
! Select a 2048-bit modulus when prompted
! Verify with: show ip ssh



